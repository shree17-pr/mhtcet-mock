<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHT CET Performance Summary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="performance-screen">
    <div class="nav-tabs">
      <a href="overview.html" class="tab">Overview</a>
      <a href="sectional-analysis.html" class="tab">Sectional</a>
      <a href="time-analysis.html" class="tab">Time</a>
      <a href="question-analysis.html" class="tab">Questions</a>
      <a href="performance-summary.html" class="tab active">Performance</a>
      <a href="charts.html" class="tab">Charts</a>
    </div>
    <div class="analysis-container">
      <div class="analysis-header">
        <h2>Performance Summary</h2>
      </div>

      <div class="summary-metrics">
        <div class="metric-card">
          <h3>Overall Accuracy</h3>
          <span id="overall-accuracy" class="metric-value">0%</span>
        </div>
        <div class="metric-card">
          <h3>Strongest Subject</h3>
          <span id="strongest-subject" class="metric-value">Physics</span>
        </div>
        <div class="metric-card">
          <h3>Weakest Subject</h3>
          <span id="weakest-subject" class="metric-value">Mathematics</span>
        </div>
      </div>

      <div class="attempt-strategy">
        <h3>Attempt Strategy Summary</h3>
        <p id="attempt-strategy">You attempted X questions with Y% accuracy.</p>
      </div>

      <div class="suggestions">
        <h3>Suggestions</h3>
        <ul id="suggestions-list"></ul>
      </div>
    </div>
  </div>

  <script src="performance-summary.js"></script>
</body>
