<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHT CET Time Analysis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="time-screen">
    <div class="nav-tabs">
      <a href="overview.html" class="tab">Overview</a>
      <a href="sectional-analysis.html" class="tab">Sectional</a>
      <a href="time-analysis.html" class="tab active">Time</a>
      <a href="question-analysis.html" class="tab">Questions</a>
      <a href="performance-summary.html" class="tab">Performance</a>
      <a href="charts.html" class="tab">Charts</a>
    </div>
    <div class="analysis-container">
      <div class="analysis-header">
        <h2>Time Analysis</h2>
      </div>

      <div class="time-metrics">
        <div class="metric-card">
          <h3>Total Time Used</h3>
          <span id="total-time" class="metric-value">00:00</span>
        </div>
        <div class="metric-card">
          <h3>Avg Time per Question</h3>
          <span id="avg-time" class="metric-value">00:00</span>
        </div>
        <div class="metric-card">
          <h3>Fastest Section</h3>
          <span id="fastest-section" class="metric-value">Physics</span>
        </div>
        <div class="metric-card">
          <h3>Slowest Section</h3>
          <span id="slowest-section" class="metric-value">Mathematics</span>
        </div>
      </div>

      <div class="time-per-section" id="time-per-section"></div>

      <div class="timeline-placeholder">
        <h3>Timeline Visualization</h3>
        <div id="timeline-bar" class="timeline-bar"></div>
      </div>
    </div>
  </div>

  <script src="time-analysis.js"></script>
</body>
